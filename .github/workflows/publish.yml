name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        # Trusted Publishing（OIDC）要求 npm >= 11.5：node 20/22 自带 npm 10.x，
        # 匿名 PUT 已有包名会被 registry 拒为 404；node 24 自带 npm 11。
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install  # 仓库无 package-lock.json（.gitignore 排除），npm ci 会直接失败

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
