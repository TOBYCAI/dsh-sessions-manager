name: compat

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'   # daily compat check
  workflow_dispatch:

permissions:
  contents: write        # 漂移检测成功后提交 runtime-last-seen.json
  issues: write          # 冒烟失败时开/更新 issue

jobs:
  build:
    name: dsh-plugin build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install
      - name: Build plugin (host + client)
        run: npm run build
      - name: Run host behavior tests
        run: npm test
      - name: Verify committed bundles match source
        run: git diff --exit-code -- lib
      - name: Verify host bundle loads
        run: node -e "import('./lib/index.js').then(m => { if (m.name !== 'dsh-sessions-manager') process.exit(1); }).catch(e => { console.error(e); process.exit(1); })"

  # 解析 npm 上 @deepseek-ai/dsh 的 dist-tags，得到需要冒烟的 runtime 版本集合
  resolve-versions:
    name: resolve runtime versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
      latest: ${{ steps.tags.outputs.latest }}
      prerelease: ${{ steps.tags.outputs.prerelease }}
    steps:
      - id: tags
        run: |
          DIST=$(npm view @deepseek-ai/dsh dist-tags --json --registry https://registry.npmjs.org)
          VERSIONS=$(echo "$DIST" | jq -c '[.latest, .next, .alpha] | unique | map(select(. != null))')
          PRERELEASE=$(curl -fsSL https://api.github.com/repos/deepseek-ai/deepseek-harness/releases | jq -r '[.[] | select(.prerelease and (.draft | not))][0].tag_name // empty')
          echo "latest=$(echo "$DIST" | jq -r .latest)" >> "$GITHUB_OUTPUT"
          echo "matrix=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "runtime versions to smoke: $VERSIONS"
          echo "source prerelease to inspect: $PRERELEASE"

  upstream-contract:
    name: upstream source contract ${{ needs.resolve-versions.outputs.prerelease }}
    needs: resolve-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect latest upstream prerelease contract
        if: needs.resolve-versions.outputs.prerelease != ''
        run: node scripts/check-upstream-contract.mjs "${{ needs.resolve-versions.outputs.prerelease }}"

  # 真实 runtime 集成冒烟：clone 官方 prerelease tag → pnpm 安装并构建 →
  # 用官方 JSONL 后端跑 scripts/compat-runtime.mjs（list/stat/bounded read/
  # 单次 close/能力门控）。上游构建偶发不稳定，job 级 continue-on-error，
  # 但失败仍会开 issue 留痕——静态契约检查不能替代运行验证。
  upstream-integration:
    name: upstream runtime smoke ${{ needs.resolve-versions.outputs.prerelease }}
    needs: [resolve-versions]
    if: needs.resolve-versions.outputs.prerelease != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout official harness at prerelease tag
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.resolve-versions.outputs.prerelease }}
          path: harness
      - name: Install harness workspace
        working-directory: harness
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build harness packages
        working-directory: harness
        run: pnpm -r build
      - name: Run real-runtime compat smoke
        id: smoke
        run: node scripts/compat-runtime.mjs "$GITHUB_WORKSPACE/harness"
      - name: Open/update issue on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ 官方 prerelease 真实 runtime 冒烟失败（' + process.env.PRERELEASE + '）'
            const body = [
              'compat-runtime 对官方 `' + process.env.PRERELEASE + '` 的真实构建失败。',
              '适配层 / 能力矩阵 / 有界读取行为可能与上游公共契约出现漂移，需人工核对。',
              '',
              'Run: https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.RUN_ID,
            ].join('\n')
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            })
            const hit = existing.data.find((i) => i.title.includes('真实 runtime 冒烟失败'))
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['compat'],
              })
            }
        env:
          PRERELEASE: ${{ needs.resolve-versions.outputs.prerelease }}
          RUN_ID: ${{ github.run_id }}

  smoke:
    name: runtime smoke ${{ matrix.version }}
    needs: [build, resolve-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compat smoke against real cordis
        run: node scripts/compat-smoke.mjs "${{ matrix.version }}"
      - name: Open/update issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ runtime 兼容性冒烟失败（' + process.env.VERSION + '）'
            const body = [
              'compat smoke 对 `@deepseek-ai/dsh@' + process.env.VERSION + '` 失败。',
              'host 的 cordis DI 契约（inject / apply / 路由注册）可能被上游破坏。',
              '',
              '本地复现：`node scripts/compat-smoke.mjs ' + process.env.VERSION + '`',
              'Run: https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.RUN_ID,
            ].join('\n')
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            })
            const hit = existing.data.find((i) => i.title.includes('runtime 兼容性冒烟失败'))
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['compat'],
              })
            }
        env:
          VERSION: ${{ matrix.version }}
          RUN_ID: ${{ github.run_id }}

  # 每日检测到 runtime latest 有漂移时提交记录文件（[skip ci] 防循环）
  track-drift:
    name: track runtime drift
    needs: [smoke, resolve-versions]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump last-seen version if changed
        run: |
          LATEST="${{ needs.resolve-versions.outputs.latest }}"
          FILE=.github/runtime-last-seen.json
          if [ -f "$FILE" ] && [ "$(jq -r .latest "$FILE")" = "$LATEST" ]; then
            echo "runtime latest 未漂移（$LATEST）"
          else
            jq -n --arg v "$LATEST" --arg t "$(date -u +%FT%TZ)" '{latest: $v, seenAt: $t}' > "$FILE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "chore(compat): runtime latest -> $LATEST [skip ci]"
            git push
            echo "已记录 runtime 漂移: $LATEST"
          fi
